<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Configuração para garantir que o site fique responsivo em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cartão de Perfil</title>
    
    <!-- CONEXÃO COM O ARQUIVO CSS EXTERNO -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Conteúdo principal e exclusivo da página -->
    <main>
        <!-- A div funciona como uma caixa organizadora do cartão -->
        <div class="cartao-perfil">
            
            <!-- Cabeçalho do cartão com foto e informações do usuário -->
            <header>
                <img src="eudo.png" alt="Foto de perfil">
                <h1>Seu Nome Aqui</h1>
                <p>Estudante de Desenvolvimento Web</p>
            </header>

            <!-- Seção de links sociais -->
            <section>
                <ul>
                    <li><a href="https://github.com/Eudolima" target="_blank">Meu GitHub</a></li>
                    <li><a href="https://linkedin.com" target="_blank">Meu LinkedIn</a></li>
                </ul>
            </section>

        </div>
    </main>

</body>
</html>
